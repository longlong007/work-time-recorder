# Nginx 配置示例 — 大陆服务器静态托管
# 替换 flytime.cloud 为已备案域名，/var/www/work-time-recorder 为部署目录

server {
    listen 80;
    server_name flytime.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name flytime.cloud;

    root /var/www/work-time-recorder;
    index index.html;

    # SSL 证书（certbot 或腾讯云免费证书，二选一）
    ssl_certificate     /etc/letsencrypt/live/flytime.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flytime.cloud/privkey.pem;
    # ssl_certificate     /etc/nginx/ssl/flytime.cloud.pem;
    # ssl_certificate_key /etc/nginx/ssl/flytime.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 第三方 SDK 可长期缓存
    location ~* ^/vendor/.+\.(css|js|json|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 业务 JS/CSS 不长期缓存，避免部署后仍加载旧代码
    location ~* \.(css|js|json|svg|woff2?)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker 不缓存，确保更新及时
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}

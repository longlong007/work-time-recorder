<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5a9bc4">
    <title>工作时间记录器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="app-card">
            <!-- 顶部标题区 -->
            <div class="header-section">
                <span class="header-icon">⏰</span>
                <h1 class="header-title">工作时间记录器</h1>
                <div class="header-actions">
                    <button type="button" class="header-icon-btn" id="shortcutsBtn" title="快捷键说明" aria-label="快捷键说明">⌨️</button>
                    <button type="button" class="theme-toggle" id="themeToggle" title="切换深色模式" aria-label="切换深色模式">🌙</button>
                </div>
            </div>

            <!-- 双栏布局容器（桌面端生效） -->
            <div class="layout-cols">

                <!-- 左栏：控制区 -->
                <div class="layout-left" id="layoutLeft">

                    <!-- 核心计时卡片 -->
                    <div class="timer-card" id="statusCard">
                        <div class="timer-card-top">
                            <div class="timer-status">
                                <span class="status-dot" id="statusDot"></span>
                                <span class="status-text" id="statusText">未开始</span>
                            </div>
                            <div class="current-work-name" id="currentWorkName" style="display: none;">
                                <span>📝</span>
                                <span id="currentWorkNameValue">工作内容</span>
                            </div>
                        </div>
                        <div class="timer-display" id="elapsedDisplay">00:00:00</div>
                        <div class="timer-wall-clock">
                            <span class="timer-sub-label">当前时间</span>
                            <span class="timer-wall-clock-value" id="wallClockTime">--:--:--</span>
                        </div>
                        <div class="alarm-progress" id="alarmProgress" style="display: none;">
                            <div class="alarm-progress-info">
                                <span class="alarm-progress-label">距离闹钟还剩</span>
                                <span class="alarm-progress-remaining" id="alarmRemainingValue">00:00</span>
                            </div>
                            <div class="alarm-progress-track">
                                <div class="alarm-progress-bar" id="alarmProgressBar" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 工作内容输入区 -->
                    <div class="work-name-section" id="workNameSection">
                        <div class="input-row">
                            <span class="input-label">工作名称</span>
                            <input
                                type="text"
                                id="workNameInput"
                                class="work-name-input"
                                placeholder="请输入工作内容名称（可选）"
                                maxlength="50">
                        </div>
                    </div>

                    <!-- 标签选择区 -->
                    <div class="tag-section">
                        <div class="quick-tags-row">
                            <div class="quick-tags" id="quickTags">
                                <!-- 标签将通过 JavaScript 动态生成 -->
                            </div>
                            <button type="button" class="btn btn-neutral btn-sm manage-tags-btn" id="manageTagsBtn">管理标签</button>
                        </div>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="action-buttons">
                        <button type="button" class="btn btn-primary" id="startBtn">
                            <span>▶</span>
                            开始工作
                        </button>
                        <button type="button" class="btn btn-danger" id="stopBtn" disabled>
                            <span>⏸</span>
                            结束工作
                        </button>
                    </div>
                    <details class="more-settings" id="moreSettings">
                        <summary class="more-settings-summary">更多设置</summary>
                        <div class="more-settings-body">
                    <!-- 闹钟提醒设置区 -->
                    <div class="reminder-section" id="alarmSection">
                        <div class="reminder-header">
                            <span class="reminder-icon">⏰</span>
                            <span class="reminder-label">闹钟提醒</span>
                            <label class="alarm-toggle">
                                <input type="checkbox" id="alarmToggle">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="reminder-options" id="alarmOptions">
                            <div class="preset-buttons">
                                <button class="preset-btn" data-minutes="5">5分钟</button>
                                <button class="preset-btn" data-minutes="10">10分钟</button>
                                <button class="preset-btn" data-minutes="15">15分钟</button>
                                <button class="preset-btn" data-minutes="30">30分钟</button>
                                <button class="preset-btn" data-minutes="45">45分钟</button>
                            </div>
                            <div class="custom-alarm">
                                <input type="number" id="customAlarmMinutes" class="custom-alarm-input" placeholder="自定义" min="1" max="480">
                                <span class="custom-alarm-unit">分钟</span>
                                <button type="button" class="btn btn-primary btn-sm" id="setAlarmBtn">设置</button>
                            </div>
                            <div class="alarm-status" id="alarmStatus"></div>
                            <div class="notify-row">
                                <button type="button" class="btn btn-neutral btn-sm" id="notifyPermissionBtn">开启系统通知</button>
                                <span class="notify-status" id="notifyStatus" role="status"></span>
                            </div>
                        </div>
                    </div>
                        </div>
                    </details>

                </div><!-- /layout-left -->

                <!-- 右栏：历史记录 + 统计 -->
                <div class="layout-right">

                    <!-- 历史记录列表 -->
                    <div class="history-section">
                        <div class="history-header">
                            <div class="history-title">
                                <span>📋</span>
                                <span>历史记录</span>
                            </div>
                            <div class="history-actions">
                                <button type="button" class="btn btn-primary btn-sm" id="exportBtn">📤 导出</button>
                                <button type="button" class="btn btn-success btn-sm" id="importBtn">📥 导入</button>
                                <button type="button" class="btn btn-danger btn-sm" id="clearBtn">清空</button>
                            </div>
                        </div>

                        <div class="filter-bar">
                            <input type="date" id="filterDate" class="date-filter">
                            <button type="button" class="btn btn-primary btn-sm" id="filterBtn">筛选</button>
                            <button type="button" class="btn btn-neutral btn-sm" id="resetFilterBtn">重置</button>
                        </div>

                        <div class="history-list" id="historyList">
                            <div class="empty-state">暂无记录</div>
                        </div>
                    </div>

                    <!-- 统计区域 -->
                    <div class="statistics-section" id="statistics">
                        <div class="stat-item">
                            <span class="stat-label">今日总计</span>
                            <span class="stat-value" id="todayTotal">00:00:00</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">本周总计</span>
                            <span class="stat-value" id="weekTotal">00:00:00</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">本月总计</span>
                            <span class="stat-value" id="monthTotal">00:00:00</span>
                        </div>
                    </div>

                </div><!-- /layout-right -->

            </div><!-- /layout-cols -->
        </div>

        <!-- 快捷键说明弹窗 -->
        <div class="modal" id="shortcutsModal" style="display: none;">
            <div class="modal-content shortcuts-modal-content">
                <div class="modal-header">
                    <h3>⌨️ 快捷键</h3>
                    <button type="button" class="btn-close" id="closeShortcutsModalBtn" aria-label="关闭">✕</button>
                </div>
                <div class="modal-body">
                    <ul class="shortcuts-list">
                        <li class="shortcuts-item">
                            <kbd>空格</kbd>
                            <span>开始 / 结束工作</span>
                        </li>
                        <li class="shortcuts-item">
                            <kbd>Ctrl</kbd><span class="shortcuts-plus">+</span><kbd>E</kbd>
                            <span>导出数据</span>
                        </li>
                        <li class="shortcuts-item">
                            <kbd>Ctrl</kbd><span class="shortcuts-plus">+</span><kbd>/</kbd>
                            <span>打开本说明</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 标签管理弹窗 -->
        <div class="modal" id="tagModal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>🏷️ 标签管理</h3>
                    <button class="btn-close" id="closeModalBtn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="tag-add-section">
                        <input
                            type="text"
                            id="newTagInput"
                            class="tag-input"
                            placeholder="输入新标签名称"
                            maxlength="20">
                        <button type="button" class="btn btn-primary btn-sm" id="addTagBtn">➕ 添加</button>
                    </div>
                    <div class="tag-list" id="tagList">
                        <!-- 标签列表将通过 JavaScript 动态生成 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 编辑记录弹窗 -->
        <div class="modal" id="editModal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>✏️ 编辑记录</h3>
                    <button class="btn-close" id="closeEditModalBtn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="edit-form">
                        <div class="form-group">
                            <label for="editWorkName" class="form-label">📝 工作内容</label>
                            <input
                                type="text"
                                id="editWorkName"
                                class="form-input"
                                placeholder="工作内容名称"
                                maxlength="50">
                        </div>
                        <div class="form-group">
                            <label for="editStartTime" class="form-label">⏰ 开始时间</label>
                            <input
                                type="datetime-local"
                                id="editStartTime"
                                class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="editEndTime" class="form-label">⏰ 结束时间</label>
                            <input
                                type="datetime-local"
                                id="editEndTime"
                                class="form-input">
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-neutral" id="cancelEditBtn">取消</button>
                            <button type="button" class="btn btn-primary" id="saveEditBtn">💾 保存</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 闹钟提醒弹窗 -->
        <div class="modal alarm-modal" id="alarmModal" style="display: none;">
            <div class="modal-content alarm-modal-content">
                <div class="alarm-modal-icon">🔔</div>
                <h3 class="alarm-modal-title">时间到！</h3>
                <p class="alarm-modal-message">您设置的闹钟时间已经到了</p>
                <div class="alarm-modal-actions">
                    <button type="button" class="btn btn-primary btn-modal" id="continueAlarmBtn">继续计时</button>
                    <button type="button" class="btn btn-danger btn-modal" id="endAlarmBtn">结束工作</button>
                </div>
            </div>
        </div>

        <!-- 隐藏的文件输入元素 -->
        <input type="file" id="importFileInput" accept=".csv" style="display: none;">
    </div>

    <script src="script.js"></script>
</body>
</html>
